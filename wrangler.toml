name = "atlas-api"
compatibility_date = "2026-08-25"
pages_build_output_dir = "dist"

# KV Namespace untuk simpan API key user & rate limit counter
[[kv_namespaces]]
binding = "ATLAS_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# (Opsional, kalau nanti butuh relasi lebih kompleks: user, usage log, billing)
# [[d1_databases]]
# binding = "ATLAS_DB"
# database_name = "atlas-api-db"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Secrets (API key provider) di-set lewat:
# wrangler pages secret put GEMINI_API_KEY
# wrangler pages secret put GROQ_API_KEY
# wrangler pages secret put OPENROUTER_API_KEY
# wrangler pages secret put HF_API_KEY
# wrangler pages secret put NVIDIA_API_KEY
# JANGAN taruh API key di sini atau di .env yang ke-commit.
